[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pmanalysis"
version = "0.1.0"
description = "Polymarket crypto up/down analysis tool with live feeds and backtest storage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "websockets>=13.0",
    "sqlalchemy>=2.0.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
pmanalysis = "pmanalysis.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pmanalysis*"]
